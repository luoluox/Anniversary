<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的纪念日</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
        }

        /* 动态粒子背景 */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) scale(1.2);
                opacity: 0;
            }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        /* 标题样式 */
        .title {
            font-size: clamp(2rem, 6vw, 4rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                         0 0 40px rgba(255, 255, 255, 0.3);
            margin-bottom: 50px;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5),
                             0 0 40px rgba(255, 255, 255, 0.3);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                             0 0 60px rgba(255, 255, 255, 0.5);
            }
        }

        /* 计时卡片 */
        .timer-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 60px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            max-width: 900px;
            width: 100%;
        }

        /* 年月日时分秒大显示 */
        .time-main {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .time-number {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: numberPulse 1s ease-in-out infinite alternate;
        }

        @keyframes numberPulse {
            from {
                transform: scale(1);
            }
            to {
                transform: scale(1.05);
            }
        }

        .time-label {
            font-size: clamp(1rem, 3vw, 1.2rem);
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            font-weight: 500;
        }

        /* 天时分秒小显示（和原图一致） */
        .time-sub {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .time-sub .highlight {
            color: #ff6b9d;
            text-shadow: 0 0 15px rgba(255, 107, 157, 0.6);
            font-weight: 700;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .timer-card {
                padding: 30px 20px;
            }
            .time-main {
                gap: 15px;
            }
            .time-unit {
                min-width: 70px;
            }
        }
    </style>
</head>
<body>
    <!-- 粒子背景容器 -->
    <div class="particles" id="particles"></div>

    <!-- 主内容容器 -->
    <div class="container">
        <h1 class="title">玛卡巴卡，我们已经在一起了</h1>
        
        <div class="timer-card">
            <!-- 年月日时分秒大显示 -->
            <div class="time-main" id="timeMain">
                <div class="time-unit">
                    <div class="time-number" id="years">0</div>
                    <div class="time-label">年</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="months">0</div>
                    <div class="time-label">月</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="days">0</div>
                    <div class="time-label">天</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="hours">0</div>
                    <div class="time-label">时</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="minutes">0</div>
                    <div class="time-label">分</div>
                </div>
                <div class="time-unit">
                    <div class="time-number" id="seconds">0</div>
                    <div class="time-label">秒</div>
                </div>
            </div>

            <!-- 天时分秒小显示（和原图一致） -->
            <div class="time-sub" id="timeSub">
                <span class="highlight">0</span> Days <span class="highlight">0</span> Hours <span class="highlight">0</span> Minutes <span class="highlight">0</span> Seconds
            </div>
        </div>
    </div>

    <script>
        // 纪念日期：2016年11月15日 0点
        const startDate = new Date(2016, 10, 15, 0, 0, 0); // 月份从0开始，10代表11月

        // 生成粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // 随机大小、位置、动画延迟
                const size = Math.random() * 8 + 2;
                const left = Math.random() * 100;
                const delay = Math.random() * 15;
                const duration = Math.random() * 10 + 10;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.animationDelay = `${delay}s`;
                particle.style.animationDuration = `${duration}s`;

                particlesContainer.appendChild(particle);
            }
        }

        // 计算时间差
        function calculateTime() {
            const now = new Date();
            const diff = now - startDate;

            // 计算总天数（用于小显示）
            const totalDays = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            // 计算年月日时分秒（精确计算）
            let years = now.getFullYear() - startDate.getFullYear();
            let months = now.getMonth() - startDate.getMonth();
            let days = now.getDate() - startDate.getDate();
            let calcHours = now.getHours() - startDate.getHours();
            let calcMinutes = now.getMinutes() - startDate.getMinutes();
            let calcSeconds = now.getSeconds() - startDate.getSeconds();

            // 处理秒、分、时、日、月的借位
            if (calcSeconds < 0) {
                calcSeconds += 60;
                calcMinutes--;
            }
            if (calcMinutes < 0) {
                calcMinutes += 60;
                calcHours--;
            }
            if (calcHours < 0) {
                calcHours += 24;
                days--;
            }
            if (days < 0) {
                const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
                days += prevMonth.getDate();
                months--;
            }
            if (months < 0) {
                months += 12;
                years--;
            }

            return {
                // 年月日时分秒
                years, months, days, hours: calcHours, minutes: calcMinutes, seconds: calcSeconds,
                // 总天时分秒（和原图一致）
                totalDays, hoursRaw: hours, minutesRaw: minutes, secondsRaw: seconds
            };
        }

        // 更新显示
        function updateTimer() {
            const time = calculateTime();

            // 更新大显示（年月日时分秒）
            document.getElementById('years').textContent = time.years;
            document.getElementById('months').textContent = time.months;
            document.getElementById('days').textContent = time.days;
            document.getElementById('hours').textContent = time.hours;
            document.getElementById('minutes').textContent = time.minutes;
            document.getElementById('seconds').textContent = time.seconds;

            // 更新小显示（和原图一致的格式）
            document.getElementById('timeSub').innerHTML = `
                <span class="highlight">${time.totalDays}</span> Days 
                <span class="highlight">${time.hoursRaw}</span> Hours 
                <span class="highlight">${time.minutesRaw}</span> Minutes 
                <span class="highlight">${time.secondsRaw}</span> Seconds
            `;
        }

        // 初始化
        window.onload = function() {
            createParticles();
            updateTimer();
            // 每秒更新一次
            setInterval(updateTimer, 1000);
        };
    </script>
</body>
</html>
